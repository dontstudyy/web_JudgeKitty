<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T야 F야 판결소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Serif+KR:wght@400;500;600;700&family=Nanum+Gothic+Coding&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --paper: #F1ECDD;
    --paper-edge: #E4DCC5;
    --ink: #211E16;
    --ink-soft: #55503F;
    --ink-faint: #8B8471;
    --seal: #A3271F;
    --seal-dark: #7C1E18;
    --line: #C9BFA0;
    --bg: #C9C1A6;
    --gold: #8A6D3B;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14120D;
      --paper: #EFEADB;
      --paper-edge: #E1D9C1;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14120D;
    --paper: #EFEADB;
    --paper-edge: #E1D9C1;
  }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(255,255,255,0.06), transparent 60%);
    font-family: "Noto Serif KR", serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 40px 16px calc(48px + env(safe-area-inset-bottom, 0px));
  }
  html, body { height: 100%; }

  .sheet {
    width: 100%;
    max-width: 620px;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5), 0 2px 0 rgba(0,0,0,0.04) inset;
    padding: 40px 36px 44px;
    position: relative;
    background-image:
      repeating-linear-gradient(transparent, transparent 27px, rgba(120,110,80,0.06) 28px);
  }
  .sheet::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(138,109,59,0.35);
    pointer-events: none;
  }

  header.letterhead {
    text-align: center;
    padding-bottom: 18px;
    margin-bottom: 22px;
    border-bottom: 2px solid var(--ink);
    position: relative;
  }
  .court-name {
    font-family: "Song Myung", serif;
    font-size: 15px;
    letter-spacing: 4px;
    color: var(--gold);
  }
  .doc-title {
    font-family: "Song Myung", serif;
    font-size: 30px;
    margin: 10px 0 4px;
    letter-spacing: 2px;
  }
  .case-no {
    font-family: "Nanum Gothic Coding", monospace;
    font-size: 12px;
    color: var(--ink-faint);
  }

  /* ---- intake form ---- */
  .intake p.lead {
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }
  label.field-label {
    display: block;
    font-size: 12.5px;
    color: var(--gold);
    margin-bottom: 8px;
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
  }
  textarea {
    width: 100%;
    min-height: 130px;
    resize: vertical;
    background: rgba(255,255,255,0.35);
    border: 1px solid var(--line);
    padding: 14px 16px;
    font-family: "Noto Serif KR", serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
    outline: none;
  }
  textarea:focus { border-color: var(--gold); }
  textarea::placeholder { color: var(--ink-faint); }

  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 24px;
  }
  .example-chip {
    font-size: 12px;
    padding: 6px 11px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: "Noto Serif KR", serif;
  }
  .example-chip:hover { border-color: var(--gold); color: var(--gold); }

  .submit-row { display: flex; justify-content: center; margin-top: 4px; }
  button.submit {
    font-family: "Song Myung", serif;
    font-size: 17px;
    letter-spacing: 3px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 14px 40px;
    cursor: pointer;
    position: relative;
  }
  button.submit:disabled { opacity: 0.55; cursor: default; }
  button.submit:not(:disabled):hover { background: var(--seal-dark); }

  .error-msg {
    margin-top: 14px;
    font-size: 13px;
    color: var(--seal);
    text-align: center;
  }

  /* ---- verdict view ---- */
  .verdict-view { display: none; }
  .verdict-view.show { display: block; }
  .intake.hide { display: none; }

  .charge-line {
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
    margin-bottom: 26px;
  }
  .charge-line b { color: var(--seal); font-weight: 600; }

  .ruling-box {
    text-align: center;
    padding: 22px 10px 26px;
    margin-bottom: 26px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .ruling-label {
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .ruling-text {
    font-family: "Song Myung", serif;
    font-size: 21px;
    line-height: 1.6;
  }

  .stamp-wrap {
    display: flex;
    justify-content: center;
    margin: 6px 0 30px;
  }
  .stamp {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    border: 4px solid var(--seal);
    color: var(--seal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Song Myung", serif;
    font-size: 56px;
    transform: rotate(-9deg) scale(0.5);
    opacity: 0;
    filter: url(#inkRough);
    box-shadow: 0 0 0 3px rgba(163,39,31,0.08);
    mix-blend-mode: multiply;
  }
  .stamp.animate {
    animation: stampDown 0.55s cubic-bezier(.2,1.3,.4,1) forwards;
  }
  @keyframes stampDown {
    0% { opacity: 0; transform: rotate(-9deg) scale(2.2); }
    60% { opacity: 1; transform: rotate(-9deg) scale(0.92); }
    100% { opacity: 1; transform: rotate(-9deg) scale(1); }
  }

  .gauge-block { margin: 0 0 30px; }
  .gauge-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-faint);
    margin-bottom: 7px;
    font-family: "Nanum Gothic Coding", monospace;
  }
  .gauge-track {
    position: relative;
    height: 6px;
    background: var(--line);
  }
  .gauge-fill {
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: var(--seal);
    width: 0%;
    transition: width 0.9s cubic-bezier(.3,.8,.3,1);
  }
  .gauge-marker {
    position: absolute;
    top: -5px;
    width: 2px; height: 16px;
    background: var(--ink);
    left: 0%;
    transition: left 0.9s cubic-bezier(.3,.8,.3,1);
  }

  section.reasoning { margin-bottom: 10px; }
  .section-label {
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .reasoning-text {
    font-size: 14.5px;
    line-height: 2;
    text-indent: 1em;
  }

  .quote-block {
    margin: 22px 0 30px;
    padding: 14px 18px;
    border-left: 3px solid var(--seal);
    background: rgba(163,39,31,0.05);
    font-size: 13.5px;
    color: var(--ink-soft);
    font-style: normal;
  }
  .quote-block::before { content: "「 "; color: var(--seal); }
  .quote-block::after { content: " 」"; color: var(--seal); }

  .footer-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  button.again {
    font-family: "Noto Serif KR", serif;
    font-size: 13.5px;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 10px 22px;
    cursor: pointer;
  }
  button.again:hover { background: var(--ink); color: var(--paper); }

  .thinking-wrap {
    display: none;
    text-align: center;
    padding: 40px 0 20px;
  }
  .thinking-wrap.show { display: block; }
  .thinking-wrap p {
    font-family: "Song Myung", serif;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }
  .gavel {
    width: 34px; height: 34px;
    margin: 0 auto;
    border: 2px solid var(--ink-soft);
    border-radius: 50%;
    position: relative;
    animation: spin 1.1s linear infinite;
    border-top-color: var(--seal);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 420px) {
    .sheet { padding: 30px 20px 34px; }
    .doc-title { font-size: 25px; }
    .ruling-text { font-size: 18px; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="inkRough">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="7"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
  </filter>
</svg>

<div class="sheet">
  <header class="letterhead">
    <div class="court-name">대 한 팩 폭 고 등 법 원</div>
    <div class="doc-title">판 결 문</div>
    <div class="case-no" id="caseNo">사건번호 2026T字 제0000호</div>
  </header>

  <div class="intake" id="intake">
    <p class="lead">
      당신 혹은 누군가의 사연을 있는 그대로 진술하십시오.<br>
      본 법정이 T인지 F인지 엄중히 판결하겠습니다.
    </p>
    <label class="field-label" for="story">사연 진술</label>
    <textarea id="story" placeholder="예: 친구가 반려견이 무지개다리 건넜다고 울면서 전화했는데, &quot;그래서 화장은 언제 해? 병원비 얼마 나왔어?&quot;라고 먼저 물어봄"></textarea>
    <div class="examples">
      <button class="example-chip" data-ex="1">🐶 강아지 부고 예시</button>
      <button class="example-chip" data-ex="2">💔 이별 통보 예시</button>
      <button class="example-chip" data-ex="3">🎂 생일 서프라이즈 예시</button>
    </div>
    <div class="submit-row">
      <button class="submit" id="submitBtn">선 고 요 청</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="thinking-wrap" id="thinkingWrap">
    <p>심 리 중 입 니 다</p>
    <div class="gavel"></div>
  </div>

  <div class="verdict-view" id="verdictView">
    <div class="charge-line">죄목: <b id="charge">—</b></div>

    <div class="ruling-box">
      <div class="ruling-label">주　문</div>
      <div class="ruling-text" id="rulingText">—</div>
      <div class="stamp-wrap">
        <div class="stamp" id="stamp">T</div>
      </div>
    </div>

    <div class="gauge-block">
      <div class="gauge-labels"><span>F 감성 100</span><span>T 이성 100</span></div>
      <div class="gauge-track">
        <div class="gauge-fill" id="gaugeFill"></div>
        <div class="gauge-marker" id="gaugeMarker"></div>
      </div>
    </div>

    <section class="reasoning">
      <div class="section-label">이　유</div>
      <div class="reasoning-text" id="reasoningText">—</div>
    </section>

    <div class="quote-block" id="quoteBlock">—</div>

    <div class="footer-row">
      <button class="again" id="againBtn">다시 진술하기</button>
    </div>
  </div>
</div>

<script>
(function () {
  const EXAMPLES = {
    1: "친구가 반려견이 무지개다리 건넜다고 울면서 전화했는데, \"그래서 화장은 언제 해? 병원비 얼마 나왔어?\"라고 먼저 물어봄",
    2: "여자친구가 헤어지자면서 3시간 동안 눈물로 그동안 서운했던 점을 얘기했는데, 다 듣고 나서 \"그래서 결론이 뭐야, 헤어지자는 거야 아니라는 거야\" 라고 정리해서 물어봄",
    3: "친구들이 몰래 준비한 깜짝 생일파티에서 다 같이 '짠!' 하고 나타났는데, 첫마디가 \"어 케이크 유통기한 확인했어?\" 였음"
  };

  const els = {
    intake: document.getElementById('intake'),
    story: document.getElementById('story'),
    submitBtn: document.getElementById('submitBtn'),
    errorMsg: document.getElementById('errorMsg'),
    thinkingWrap: document.getElementById('thinkingWrap'),
    verdictView: document.getElementById('verdictView'),
    charge: document.getElementById('charge'),
    rulingText: document.getElementById('rulingText'),
    stamp: document.getElementById('stamp'),
    gaugeFill: document.getElementById('gaugeFill'),
    gaugeMarker: document.getElementById('gaugeMarker'),
    reasoningText: document.getElementById('reasoningText'),
    quoteBlock: document.getElementById('quoteBlock'),
    againBtn: document.getElementById('againBtn'),
    caseNo: document.getElementById('caseNo'),
  };

  function randomCaseNo() {
    const n = Math.floor(Math.random() * 9000) + 1000;
    return `사건번호 2026T字 제${n}호`;
  }
  els.caseNo.textContent = randomCaseNo();

  document.querySelectorAll('.example-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      els.story.value = EXAMPLES[btn.dataset.ex];
      els.story.focus();
    });
  });

  let sample = null;
  let sampling = false;

  async function initSample() {
    try {
      sample = await claude.use('sample');
    } catch (e) {
      sample = null;
    }
  }
  initSample();

  function buildPrompt(story) {
    return `당신은 대한민국 어느 지방법원의 괴짜 판사입니다. 사람들이 진술한 상황을 보고, 그 상황 속 인물(또는 행동)이 MBTI 상 T(사고형)인지 F(감정형)인지 "판결"을 내려야 합니다.

말투는 실제 판결문처럼 근엄하고 격식 있는 법률 문서체를 유지하되, 내용 자체는 과장되고 재치있게 써서 웃음을 유발해야 합니다. 진지한 척 할수록 좋습니다. 절대 상황을 그대로 요약하지 말고, 판사가 사건을 재해석해서 죄를 묻듯이 써주세요.

다음 JSON 형식으로만 답하세요. 다른 설명은 절대 붙이지 마세요.

{
  "verdict": "T 또는 F 둘 중 하나",
  "score": "0~100 사이 정수. 100에 가까울수록 명백한 T, 0에 가까울수록 명백한 F, 애매하면 40~60 사이",
  "charge": "죄목처럼 표현한 8자 이내의 짧은 문구 (예: 공감결핍죄, 팩폭남발죄, 과잉감정죄)",
  "ruling": "주문 문구 한 문장. 예: 피고인을 T형으로 선고한다. 또는 피고인의 F력이 인정된다.",
  "reasoning": "이유. 3~4문장의 법률 문서체. 진술 속 구체적인 발언이나 행동을 반드시 인용하며 판결 근거를 설명. 과장되고 웃기게.",
  "quote": "진술 속에서 가장 결정적이었던 한 마디나 행동을 10~25자 이내로 짧게 인용"
}

진술: ${story}`;
  }

  async function submitCase() {
    const story = els.story.value.trim();
    els.errorMsg.textContent = '';
    if (!story) {
      els.errorMsg.textContent = '진술 내용을 입력해 주십시오.';
      return;
    }
    if (!sample) {
      try { sample = await claude.use('sample'); } catch (e) {}
    }
    if (!sample) {
      els.errorMsg.textContent = '현재 이 화면에서는 판결 기능을 사용할 수 없습니다.';
      return;
    }
    if (sampling) return;
    sampling = true;
    els.submitBtn.disabled = true;
    els.intake.classList.add('hide');
    els.thinkingWrap.classList.add('show');
    els.verdictView.classList.remove('show');

    try {
      const data = await sample.json(buildPrompt(story), { modelTier: 'default' });
      renderVerdict(data);
    } catch (e) {
      els.thinkingWrap.classList.remove('show');
      els.intake.classList.remove('hide');
      let msg = '판결 도중 오류가 발생했습니다. 다시 시도해 주십시오.';
      if (e && e.code === 'not_granted') msg = '판결 기능 사용이 허용되지 않았습니다.';
      if (e && e.code === 'rate_limited') msg = '재판정이 혼잡합니다. 잠시 후 다시 시도해 주십시오.';
      els.errorMsg.textContent = msg;
    } finally {
      sampling = false;
      els.submitBtn.disabled = false;
    }
  }

  function renderVerdict(data) {
    const verdict = (data && (data.verdict === 'F' ? 'F' : 'T')) || 'T';
    let score = Number(data && data.score);
    if (!Number.isFinite(score)) score = 50;
    score = Math.max(0, Math.min(100, score));

    els.thinkingWrap.classList.remove('show');
    els.charge.textContent = (data && data.charge) || '판단 보류죄';
    els.rulingText.textContent = (data && data.ruling) || `피고인을 ${verdict}형으로 선고한다.`;
    els.reasoningText.textContent = (data && data.reasoning) || '이유 불충분으로 추가 심리가 필요합니다.';
    els.quoteBlock.textContent = (data && data.quote) || '—';

    els.stamp.textContent = verdict;
    els.stamp.classList.remove('animate');
    void els.stamp.offsetWidth;
    els.stamp.classList.add('animate');

    els.gaugeFill.style.width = '0%';
    els.gaugeMarker.style.left = '0%';

    els.verdictView.classList.add('show');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        els.gaugeFill.style.width = score + '%';
        els.gaugeMarker.style.left = score + '%';
      });
    });
  }

  els.submitBtn.addEventListener('click', submitCase);
  els.story.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submitCase();
  });

  els.againBtn.addEventListener('click', () => {
    els.verdictView.classList.remove('show');
    els.intake.classList.remove('hide');
    els.caseNo.textContent = randomCaseNo();
    els.story.value = '';
    els.errorMsg.textContent = '';
    els.story.focus();
  });
})();
</script>
</body>
</html>
